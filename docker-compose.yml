version: '3.8'

services:
  mysql:
    image: mysql:9.0
    container_name: trailmandu-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: cloud
      MYSQL_DATABASE: trailmandu
    ports:
      # Exposed on 3307 on the host to avoid conflicting with any local MySQL running on 3306
      - "3307:3306"
    volumes:
      # Persist MySQL data in a docker volume
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcloud"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trailmandu-redis
    restart: always
    ports:
      # Exposed on 6380 on the host to avoid conflicting with any local Redis running on 6379
      - "6380:6379"

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: trailmandu-redis-commander
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trailmandu-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/src/resources/uploads:/app/dist/src/resources/uploads
    command: >
      sh -c "npx prisma migrate deploy && node dist/src/prisma/import-backup.js && npm run start"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trailmandu-frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

volumes:
  mysql_data:
